# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# https://symfony.com/doc/current/service_container/import.html

parameters:
    # OpenRouter
    openrouter_api_key: '%env(OPENROUTER_API_KEY)%'
    gemini_api_key: '%env(default::GEMINI_API_KEY)%'
    
    # SerpAPI / RapidAPI
    app.serpapi_key: '%env(SERPAPI_KEY)%'
    app.rapidapi_key: '%env(RAPIDAPI_KEY)%'
    app.rapidapi_host: '%env(RAPIDAPI_HOST)%'

    # Football-Data API
    football_data_api_key: '%env(FOOTBALL_DATA_API_KEY)%'
    
    # Mailer Configuration
    mailer_from_email: '%env(MAILER_FROM_EMAIL)%'
    mailer_from_name: '%env(MAILER_FROM_NAME)%'
    app.server_pid_file: '%env(default::SERVER_PID_FILE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    App\:
        resource: '../src/'

    App\EventSubscriber\ServerRestartSubscriber:
        arguments:
            $pidFile: '%app.server_pid_file%'
            $projectDir: '%kernel.project_dir%'

    # TranslationService ??? bind the API key (string, not auto-injectable)
    App\Service\TranslationService:
        bind:
            $openrouterApiKey: '%openrouter_api_key%'
        tags:
            - { name: monolog.logger, channel: translation }

    App\Service\OpenRouterService:
        bind:
            $openRouterApiKey: '%openrouter_api_key%'

    App\Service\ProductivityAiService:
        bind:
            $geminiApiKey: '%gemini_api_key%'

    App\Service\GeminiService:
        bind:
            $geminiApiKey: '%gemini_api_key%'

    App\Service\SportsApiService:
        bind:
            $footballDataApiKey: '%football_data_api_key%'

