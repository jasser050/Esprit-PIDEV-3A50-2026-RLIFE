security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\GoogleAuthenticator
            entry_point: form_login
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Security\LoginSuccessHandler
            logout:
                path: app_logout
                target: app_landing
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/courses, roles: ROLE_USER }
        - { path: ^/assignments, roles: ROLE_USER }
        - { path: ^/planning, roles: ROLE_USER }
        - { path: ^/projects, roles: ROLE_USER }
        - { path: ^/revisions, roles: ROLE_USER }
        - { path: ^/wellbeing, roles: ROLE_USER }
        - { path: ^/settings, roles: ROLE_USER }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/admin/question-stress/reorder$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/login, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
